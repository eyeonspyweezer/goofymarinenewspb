# Put at: .github/workflows/render-maps.yml  (in the opvrcinteractivemap repo)
name: Render map images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "island-colors.tsv"
      - "island-groups.tsv"
      - "TargetedMap.PNG"
      - "render_maps.py"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python render_maps.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add drawn islands
          git commit -m "Update map images" || exit 0
          git push
